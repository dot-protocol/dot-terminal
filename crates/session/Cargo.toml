[package]
name = "dot-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent local terminal sessions: the DOT Terminal runtime foundation"
[dependencies]
dot-terminal-engine = { path = "../terminal" }
dot-terminal-protocol = { path = "../protocol" }
dot-terminal-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
anyhow = "1"
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
crossterm = "0.29"
base64 = "0.23"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
[dev-dependencies]
tempfile = "3"
