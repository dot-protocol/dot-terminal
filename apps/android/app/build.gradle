plugins { id 'com.android.application' }
android {
    namespace 'world.dot.terminal'
    compileSdk 36
    defaultConfig {
        applicationId 'world.dot.terminal'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '0.1.0-dev'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug { applicationIdSuffix (project.hasProperty('dotTestApp') ? '.uxlab' : '.dev'); manifestPlaceholders = [cleartext:'true'] }
        release { manifestPlaceholders = [cleartext:'false'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main { jniLibs.srcDirs = ['../../../target/android-jni'] } }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.activity:activity:1.13.0'
}
