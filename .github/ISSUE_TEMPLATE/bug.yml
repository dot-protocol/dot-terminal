name: Bug report
description: A reproducible failure in implemented behavior
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Commands, expected behavior, and actual behavior. Remove private terminal content.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, architecture, Rust version, and commit
    validations:
      required: true
