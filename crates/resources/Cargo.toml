[package]
name = "dot-terminal-resources"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros", "process", "time", "io-util"] }
